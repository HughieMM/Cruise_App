<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruise App - Messaging</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Login Screen -->
        <div id="loginScreen" class="screen active">
            <div class="login-card">
                <div class="cruise-logo">
                    <svg width="60" height="60" viewBox="0 0 60 60">
                        <path d="M10 30 L50 30 M30 10 L30 50" stroke="#0066cc" stroke-width="3" fill="none"/>
                        <circle cx="30" cy="30" r="20" stroke="#0066cc" stroke-width="3" fill="none"/>
                    </svg>
                </div>
                <h1>Cruise Messenger</h1>
                <p class="subtitle">Connect with passengers and crew</p>
                <form id="loginForm">
                    <input type="text" id="userName" placeholder="Enter your name" required>
                    <select id="userRole" required>
                        <option value="">Select role</option>
                        <option value="passenger">Passenger</option>
                        <option value="crew">Crew Member</option>
                    </select>
                    <button type="submit" class="btn btn-primary">Start Messaging</button>
                </form>
            </div>
        </div>

        <!-- Main Messaging Screen -->
        <div id="messagingScreen" class="screen">
            <div class="messaging-container">
                <!-- Sidebar -->
                <div class="sidebar">
                    <div class="sidebar-header">
                        <div class="user-info">
                            <div class="user-avatar" id="currentUserAvatar"></div>
                            <div>
                                <div class="user-name" id="currentUserName"></div>
                                <div class="user-role" id="currentUserRole"></div>
                            </div>
                        </div>
                    </div>

                    <div class="conversations-section">
                        <div class="section-header">
                            <h3>Conversations</h3>
                            <button class="btn-icon" id="newConversationBtn" title="New Conversation">+</button>
                        </div>
                        <div id="conversationsList" class="conversations-list"></div>
                    </div>

                    <div class="users-section">
                        <div class="section-header">
                            <h3>Users Online</h3>
                        </div>
                        <div id="usersList" class="users-list"></div>
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="chat-area">
                    <div class="empty-state" id="emptyState">
                        <svg width="80" height="80" viewBox="0 0 80 80">
                            <circle cx="40" cy="40" r="35" stroke="#e0e0e0" stroke-width="3" fill="none"/>
                            <path d="M25 35 Q40 25 55 35" stroke="#e0e0e0" stroke-width="3" fill="none"/>
                            <circle cx="30" cy="30" r="3" fill="#e0e0e0"/>
                            <circle cx="50" cy="30" r="3" fill="#e0e0e0"/>
                        </svg>
                        <h3>Welcome to Cruise Messenger</h3>
                        <p>Select a conversation or start a new one</p>
                    </div>

                    <div class="chat-content" id="chatContent" style="display: none;">
                        <div class="chat-header">
                            <div class="chat-title" id="chatTitle"></div>
                            <div class="chat-participants" id="chatParticipants"></div>
                        </div>

                        <div class="messages-container" id="messagesContainer"></div>

                        <div class="typing-indicator" id="typingIndicator" style="display: none;">
                            <span class="typing-dots">
                                <span></span>
                                <span></span>
                                <span></span>
                            </span>
                            <span class="typing-text"></span>
                        </div>

                        <div class="message-input-container">
                            <textarea
                                id="messageInput"
                                placeholder="Type your message..."
                                rows="1"></textarea>
                            <button id="sendMessageBtn" class="btn btn-primary">
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="white">
                                    <path d="M2 10 L18 2 L12 18 L9 12 Z"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- New Conversation Modal -->
        <div id="newConversationModal" class="modal">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>New Conversation</h2>
                    <button class="modal-close" id="closeModalBtn">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="conversationTitle" placeholder="Conversation title (optional)">
                    <h4>Select participants:</h4>
                    <div id="usersSelectionList" class="users-selection-list"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="cancelModalBtn">Cancel</button>
                    <button class="btn btn-primary" id="createConversationBtn">Create</button>
                </div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
